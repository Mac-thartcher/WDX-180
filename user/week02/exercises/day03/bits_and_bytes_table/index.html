<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bits & Bytes table</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      table {
        width: 60%;
        border-collapse: collapse;
        margin: 20px auto;
        background-color: #fff8a3;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      }
      th,
      td {
        border: 1px solid #333;
        padding: 10px;
        text-align: center;
      }
      th {
        background-color: #fff8a3;
      }
      h1 {
        text-align: center;
        font-size: 2rem;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Bits & Bytes table</h1>

    <table>
      <thead>
        <tr>
          <th colspan="3">Decimal</th>
          <th colspan="3">Binary</th>
        </tr>
        <tr>
          <th>Value</th>
          <th>Abbr.</th>
          <th>Prefix</th>
          <th>Value</th>
          <th>Abbr.</th>
          <th>Prefix</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1000</td>
          <td>K</td>
          <td>kilo</td>
          <td>1024</td>
          <td>Ki</td>
          <td>kibi</td>
        </tr>
        <tr>
          <td>1000<sup>2</sup></td>
          <td>M</td>
          <td>mega</td>
          <td>1024<sup>2</sup></td>
          <td>Mi</td>
          <td>mebi</td>
        </tr>
        <tr>
          <td>1000<sup>3</sup></td>
          <td>G</td>
          <td>giga</td>
          <td>1024<sup>3</sup></td>
          <td>Gi</td>
          <td>gibi</td>
        </tr>
        <tr>
          <td>1000<sup>4</sup></td>
          <td>T</td>
          <td>tera</td>
          <td>1024<sup>4</sup></td>
          <td>Ti</td>
          <td>tebi</td>
        </tr>
        <tr>
          <td>1000<sup>5</sup></td>
          <td>P</td>
          <td>peta</td>
          <td>1024<sup>5</sup></td>
          <td>Pi</td>
          <td>pebi</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
